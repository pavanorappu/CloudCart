apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: cloudcart-ingress

spec:
  ingressClassName: nginx

  rules:
  - host: cloudcart.local

    http:
      paths:

      - path: /
        pathType: Prefix

        backend:
          service:
            name: cloudcart-backend-service

            port:
              number: 5000

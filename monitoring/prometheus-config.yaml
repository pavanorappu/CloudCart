apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:

      - job_name: "cloudcart"

        static_configs:
          - targets:
              - cloudcart-backend-service:5000

      - job_name: "kube-state-metrics"

        static_configs:
          - targets:
              - kube-state-metrics.kube-system.svc.cluster.local:8080
